[package]
name = "kiroaas"
version = "1.2.5"
description = "KiroaaS Desktop App"
authors = ["KiroaaS Team"]
license = "AGPL-3.0"
repository = "https://github.com/hnewcity/KiroaaS"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "os-all", "updater", "system-tray", "window-start-dragging", "fs-write-file", "fs-read-file", "fs-create-dir", "dialog-save", "dialog-open", "fs-read-dir", "path-all", "shell-open"] }
# No crates.io release targets Tauri 1.x, so this tracks the plugins-workspace
# v1 branch pinned to an exact commit for reproducible builds.
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "1e407ed56455558cf751022fd68eca3b9e3713a0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
dirs = "5.0"
auto-launch = "0.5"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.180"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
